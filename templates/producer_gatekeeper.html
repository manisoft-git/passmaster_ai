<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔒 Producer Console Gatekeeper — PassMaster AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      background: radial-gradient(circle at top, #111b2b 0%, #080c14 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 1.5rem;
    }
    .gatekeeper-card {
      max-width: 440px;
      width: 100%;
      background: rgba(16, 24, 40, 0.85);
      border: 1px solid rgba(59, 130, 246, 0.25);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 2.5rem 2rem;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 35px rgba(59, 130, 246, 0.15);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .gatekeeper-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #10b981);
    }
    .shield-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: inline-block;
      animation: floatLock 3s ease-in-out infinite;
    }
    @keyframes floatLock {
      0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); }
      50% { transform: translateY(-6px) scale(1.04); filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.7)); }
    }
    .gatekeeper-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    .gatekeeper-desc {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .gatekeeper-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .gatekeeper-input {
      background: rgba(11, 15, 25, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      transition: all 0.2s ease;
    }
    .gatekeeper-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
      background: rgba(15, 23, 42, 0.95);
    }
    .gatekeeper-btn {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.5);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .gatekeeper-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -4px rgba(37, 99, 235, 0.7);
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      padding: 0.65rem;
      border-radius: 8px;
      font-size: 0.825rem;
      margin-bottom: 1rem;
      font-weight: 500;
    }
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: #64748b;
      font-size: 0.8rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="gatekeeper-card">
    <div style="display:flex; align-items:center; gap:6px; margin-bottom:1.2rem; padding-bottom:0.75rem; border-bottom:1px solid rgba(255,255,255,0.08);">
      <span style="width:10px; height:10px; border-radius:50%; background:#ff5f56; display:inline-block;"></span>
      <span style="width:10px; height:10px; border-radius:50%; background:#ffbd2e; display:inline-block;"></span>
      <span style="width:10px; height:10px; border-radius:50%; background:#27c93f; display:inline-block;"></span>
      <span style="font-size:0.75rem; color:#94a3b8; font-weight:700; font-family:'JetBrains Mono', monospace; margin-left:8px;">PASSMASTER PRODUCER // ACCESS CONTROL</span>
    </div>
    <div class="shield-icon">🛡️</div>
    <div class="gatekeeper-title">PassMaster Producer Console</div>
    <div class="gatekeeper-desc">
      Executive oversight portal for platform governance, direct student bank verification, voucher PIN issuance, and real-time revenue telemetry.
    </div>

    {% if error %}
    <div class="error-msg">⚠️ {{ error }}</div>
    {% endif %}

    <form class="gatekeeper-form" method="POST" action="/producer">
      <input 
        type="password" 
        name="console_key" 
        class="gatekeeper-input" 
        placeholder="••••••••••••••••" 
        required 
        autofocus
        autocomplete="off"
      >
      <button type="submit" class="gatekeeper-btn">
        <span>⚡</span> Unlock Producer Console
      </button>
    </form>

    <a href="/" class="back-link">← Return to Student App</a>
  </div>
</body>
</html>
