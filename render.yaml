databases:
  - name: manisoft-passmaster-db
    plan: free
    databaseName: passmasterai_db
    user: passmasterai_user
    region: oregon

services:
  - type: web
    name: manisoft-passmaster-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
    envVars:
      - key: PORT
        value: 10000
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: manisoft-passmaster-db
          property: connectionString
